<!-- title: Post -->
<main class="home">
  <article id="post-content" class="prose"></article>
  <section class="comments-section" id="comments">
    <h2 class="prompt">k@kerli:~$ <span class="prompt-path">cat /var/log/comments</span></h2>
    <div id="comment-list"></div>
  <form id="comment-form" class="ask-form">
  <label class="field"><span class="field-label">name (optional)</span>
    <input type="text" name="name" placeholder="anon"></label>
  <label class="field"><span class="field-label">message</span>
    <textarea name="text" rows="4" required></textarea></label>

  <!-- honeypot: hidden from humans, bots fill it -->
  <input type="text" name="website" tabindex="-1" autocomplete="off"
         style="position:absolute;left:-9999px" aria-hidden="true">
  <!-- time-trap timestamp -->
  <input type="hidden" name="ts" id="ts">

  <button class="btn" type="submit">send note →</button>
  <p class="form-status" id="form-status" aria-live="polite"></p>
</form>
  </section>
  <p class="back-link"><a href="blog.html">← cd ~/blog</a></p>
</main>
<script src="/js/post.js" defer></script>
