AWSTemplateFormatVersion: "2010-09-09"
Description: kerli.website — S3/CloudFront static site + Lambda API + DynamoDB

Parameters:
  DomainName:
    Type: String
    Default: kerli.website
  SiteOrigin:
    Type: String
    Default: https://kerli.website
    Description: Used for CORS and absolute links
  AdminSecret:
    Type: String
    NoEcho: true
    MinLength: 16
    Description: Bearer token for /admin and write endpoints
  IamSalt:
    Type: String
    NoEcho: true
    MinLength: 16
    Description: Salt for hashing submitter IPs
  SpamBlacklist:
    Type: String
    Default: ""
    Description: Comma-separated spam words (optional)
  CertificateArn:
    Type: String
    Description: ACM certificate ARN in us-east-1 for CloudFront
  HostedZoneId:
    Type: String
    Default: ""
    Description: Route 53 hosted zone ID for the domain (leave blank to create resources only)
  BudgetEmail:
    Type: String
    Default: ""
    Description: Email for billing budget alert (optional)

Globals: {} # CloudFormation does not support Globals; kept for clarity

Resources:
  # ------------------------------------------------------------------
  # DynamoDB tables
  # ------------------------------------------------------------------
  PostsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: kerli-posts
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: id
          AttributeType: S
      KeySchema:
        - AttributeName: id
          KeyType: HASH
      Tags:
        - Key: project
          Value: kerli

  CommentsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: kerli-comments
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: postId
          AttributeType: S
        - AttributeName: id
          AttributeType: S
        - AttributeName: ip
          AttributeType: S
        - AttributeName: ts
          AttributeType: N
      KeySchema:
        - AttributeName: postId
          KeyType: HASH
        - AttributeName: id
          KeyType: RANGE
      GlobalSecondaryIndexes:
        - IndexName: ip-ts-index
          KeySchema:
            - AttributeName: ip
              KeyType: HASH
            - AttributeName: ts
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true
      Tags:
        - Key: project
          Value: kerli

  ArchiveTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: kerli-comments-archive
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: postId
          AttributeType: S
        - AttributeName: id
          AttributeType: S
      KeySchema:
        - AttributeName: postId
          KeyType: HASH
        - AttributeName: id
          KeyType: RANGE
      Tags:
        - Key: project
          Value: kerli

  # ------------------------------------------------------------------
  # Lambda execution role (least privilege)
  # ------------------------------------------------------------------
  ApiFunctionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: kerli-api-lambda-role
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns: []
      Policies:
        - PolicyName: CloudWatchLogs
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !Sub "arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/kerli-api:*"
        - PolicyName: DynamoDBScoped
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:PutItem
                  - dynamodb:DeleteItem
                  - dynamodb:Scan
                  - dynamodb:Query
                Resource:
                  - !GetAtt PostsTable.Arn
                  - !GetAtt CommentsTable.Arn
                  - !GetAtt ArchiveTable.Arn
                  - !Sub "${CommentsTable.Arn}/index/ip-ts-index"
      Tags:
        - Key: project
          Value: kerli

  # ------------------------------------------------------------------
  # Lambda function
  # ------------------------------------------------------------------
  ApiFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: kerli-api
      Runtime: nodejs20.x
      Handler: index.handler
      Role: !GetAtt ApiFunctionRole.Arn
      ReservedConcurrentExecutions: 10
      Timeout: 10
      MemorySize: 256
      Environment:
        Variables:
          POSTS_TABLE: !Ref PostsTable
          COMMENTS_TABLE: !Ref CommentsTable
          ARCHIVE_TABLE: !Ref ArchiveTable
          SITE_ORIGIN: !Ref SiteOrigin
          ADMIN_SECRET: !Ref AdminSecret
          IP_SALT: !Ref IamSalt
          SPAM_BLACKLIST: !Ref SpamBlacklist
          COMMENT_TTL_DAYS: "7"
          RATE_WINDOW_MS: "3600000"
          RATE_MAX: "5"
          COMMENT_MAX: "1000"
          NAME_MAX: "60"
          TITLE_MAX: "200"
          HTML_MAX: "100000"
          PAGE_SIZE: "10"
      Code:
        # Deploy script overwrites this with a ZipFile/S3 location.
        ZipFile: |
          exports.handler = async () => ({statusCode:200,body:"deploy me"});
      Tags:
        - Key: project
          Value: kerli

  ApiFunctionUrl:
    Type: AWS::Lambda::Url
    Properties:
      AuthType: NONE
      TargetFunctionArn: !Ref ApiFunction
      Cors:
        AllowOrigins:
          - !Ref SiteOrigin
        AllowMethods:
          - GET
          - POST
          - DELETE
          - OPTIONS
        AllowHeaders:
          - Content-Type
          - Authorization
        MaxAge: 86400

  ApiFunctionUrlPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref ApiFunction
      Action: lambda:InvokeFunctionUrl
      Principal: "*"
      FunctionUrlAuthType: NONE

  # ------------------------------------------------------------------
  # S3 static bucket
  # ------------------------------------------------------------------
  SiteBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Ref DomainName
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      VersioningConfiguration:
        Status: Enabled
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      Tags:
        - Key: project
          Value: kerli

  SiteBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref SiteBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: AllowCloudFrontOAC
            Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub "${SiteBucket.Arn}/*"
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub "arn:aws:cloudfront::${AWS::AccountId}:distribution/${SiteDistribution}"

  # ------------------------------------------------------------------
  # CloudFront distribution
  # ------------------------------------------------------------------
  OriginAccessControl:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: kerli-oac
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  SiteDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Aliases:
          - !Ref DomainName
        DefaultRootObject: index.html
        CustomErrorResponses:
          - ErrorCode: 404
            ResponseCode: 404
            ResponsePagePath: /404.html
            ErrorCachingMinTTL: 300
          - ErrorCode: 403
            ResponseCode: 404
            ResponsePagePath: /404.html
            ErrorCachingMinTTL: 300
        DefaultCacheBehavior:
          TargetOriginId: s3
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods:
            - GET
            - HEAD
            - OPTIONS
          CachedMethods:
            - GET
            - HEAD
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6 # Managed-CachingOptimized
          OriginRequestPolicyId: 88a5a4b4-4e2c-4e4c-9b8c-9b8c9b8c9b8c # Managed-CORS-S3Origin
          Compress: true
        CacheBehaviors:
          - PathPattern: "/rss.xml"
            TargetOriginId: api
            ViewerProtocolPolicy: https-only
            AllowedMethods:
              - GET
              - HEAD
              - OPTIONS
            CachedMethods:
              - GET
              - HEAD
            CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad # Managed-CachingDisabled
            OriginRequestPolicyId: 216adef6-5c7f-47e4-b989-5492eafa07d3 # Managed-AllViewer
        Origins:
          - Id: s3
            DomainName: !GetAtt SiteBucket.RegionalDomainName
            S3OriginConfig:
              OriginAccessIdentity: ""
            OriginAccessControlId: !Ref OriginAccessControl
          - Id: api
            DomainName: !Select [2, !Split ["/", !GetAtt ApiFunctionUrl.FunctionUrl]]
            CustomOriginConfig:
              OriginProtocolPolicy: https-only
              OriginSSLProtocols:
                - TLSv1.2
        PriceClass: PriceClass_100
        Enabled: true
        HttpVersion: http2and3
        ViewerCertificate:
          AcmCertificateArn: !Ref CertificateArn
          SslSupportMethod: sni-only
          MinimumProtocolVersion: TLSv1.2_2021
      Tags:
        - Key: project
          Value: kerli

  DnsRecord:
    Type: AWS::Route53::RecordSet
    Condition: HasHostedZone
    Properties:
      HostedZoneId: !Ref HostedZoneId
      Name: !Ref DomainName
      Type: A
      AliasTarget:
        DNSName: !GetAtt SiteDistribution.DomainName
        HostedZoneId: Z2FDTNDATAQYW2 # CloudFront hosted zone ID
        EvaluateTargetHealth: false

  DnsRecordIpv6:
    Type: AWS::Route53::RecordSet
    Condition: HasHostedZone
    Properties:
      HostedZoneId: !Ref HostedZoneId
      Name: !Ref DomainName
      Type: AAAA
      AliasTarget:
        DNSName: !GetAtt SiteDistribution.DomainName
        HostedZoneId: Z2FDTNDATAQYW2
        EvaluateTargetHealth: false

  # ------------------------------------------------------------------
  # Billing / cost guardrails
  # ------------------------------------------------------------------
  MonthlyBudget:
    Type: AWS::Budgets::Budget
    Condition: HasBudgetEmail
    Properties:
      Budget:
        BudgetName: kerli-monthly-budget
        BudgetLimit:
          Amount: 10
          Unit: USD
        TimeUnit: MONTHLY
        BudgetType: COST
      NotificationsWithSubscribers:
        - Notification:
            NotificationType: ACTUAL
            ComparisonOperator: GREATER_THAN
            Threshold: 80
          Subscribers:
            - SubscriptionType: EMAIL
              Address: !Ref BudgetEmail

  # ------------------------------------------------------------------
  # CloudWatch alarms
  # ------------------------------------------------------------------
  LambdaErrorAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: kerli-api-errors
      MetricName: Errors
      Namespace: AWS/Lambda
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      Dimensions:
        - Name: FunctionName
          Value: !Ref ApiFunction

  LambdaThrottleAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: kerli-api-throttles
      MetricName: Throttles
      Namespace: AWS/Lambda
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      Dimensions:
        - Name: FunctionName
          Value: !Ref ApiFunction

Conditions:
  HasHostedZone: !Not [!Equals [!Ref HostedZoneId, ""]]
  HasBudgetEmail: !Not [!Equals [!Ref BudgetEmail, ""]]

Outputs:
  ApiUrl:
    Description: Lambda function URL (set this in js/config.js)
    Value: !GetAtt ApiFunctionUrl.FunctionUrl
  DistributionId:
    Description: CloudFront distribution ID
    Value: !Ref SiteDistribution
  BucketName:
    Description: S3 bucket for static files
    Value: !Ref SiteBucket
